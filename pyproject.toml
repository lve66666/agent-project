[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pine-agent"
version = "0.1.0"
description = "A small coding agent implemented without agent frameworks"
requires-python = ">=3.11"

[project.scripts]
pine = "pine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
